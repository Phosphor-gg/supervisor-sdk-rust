[package]
name = "supervisor-sdk"
version = "0.2.0"
edition = "2021"
description = "Official Rust SDK for the Supervisor content moderation API"
license = "MIT"
repository = "https://github.com/Phosphor-gg/supervisor-sdk-rust"
keywords = ["moderation", "content-moderation", "ai", "safety"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
supervisor-types = { git = "https://github.com/Phosphor-gg/supervisor-types.git", rev = "7639aa7" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
image = { version = "0.25", optional = true }
# Not optional: moderate_video base64-encodes the clip regardless of
# whether the image-prep feature is on.
base64 = "0.23"

[features]
default = ["image-prep"]
blocking = ["reqwest/blocking"]
image-prep = ["dep:image"]
