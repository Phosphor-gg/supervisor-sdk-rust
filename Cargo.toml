[package]
name = "supervisor-sdk"
version = "0.2.0"
edition = "2021"
description = "Official Rust SDK for the Supervisor content moderation API"
license = "MIT"
repository = "https://github.com/Phosphor-gg/supervisor-sdk-rust"
keywords = ["moderation", "content-moderation", "ai", "safety"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
supervisor-types = { git = "https://github.com/Phosphor-gg/supervisor-types.git", rev = "fcdde0352aa3ffb59a6b04f712d59cb338cd3cc8" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[features]
default = []
blocking = ["reqwest/blocking"]
